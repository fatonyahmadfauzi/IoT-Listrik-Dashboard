<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250">
  <defs>
    <style>
      .bg{fill:#f6f3ea}
      .panel{fill:#ffffff;stroke:#20242b;stroke-width:2}
      .zone{fill:#fbfaf6;stroke:#aeb6c1;stroke-width:1.5}
      .zone-title{font:700 22px Arial,Helvetica,sans-serif;fill:#18202a}
      .title{font:800 36px Arial,Helvetica,sans-serif;fill:#111827}
      .subtitle{font:500 18px Arial,Helvetica,sans-serif;fill:#475569}
      .block-title{font:800 20px Arial,Helvetica,sans-serif;fill:#111827}
      .label{font:700 16px Arial,Helvetica,sans-serif;fill:#111827}
      .small{font:500 14px Arial,Helvetica,sans-serif;fill:#334155}
      .tiny{font:500 12px Arial,Helvetica,sans-serif;fill:#475569}
      .pin{fill:#eef2ff;stroke:#475569;stroke-width:1}
      .pintext{font:700 12px Arial,Helvetica,sans-serif;fill:#1e293b}
      .ac-l{stroke:#d61f1f;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .ac-n{stroke:#111827;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dc5{stroke:#0ea5e9;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dc12{stroke:#f59e0b;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .gnd{stroke:#475569;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .sig{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
      .ctrl{stroke:#10b981;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .ct{stroke:#f97316;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 7}
      .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .ok{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
      .no{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
      .note-title{font:800 17px Arial,Helvetica,sans-serif;fill:#111827}
      .note{font:500 15px Arial,Helvetica,sans-serif;fill:#334155}
      .mark{font:800 18px Arial,Helvetica,sans-serif;fill:#111827}
      .terminal{fill:#e5e7eb;stroke:#374151;stroke-width:1.5}
      .termtext{font:800 13px Arial,Helvetica,sans-serif;fill:#111827}
      .icon{font:800 26px Arial,Helvetica,sans-serif;fill:#0f172a}
    </style>
    <marker id="arrow-red" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L14,5 z" fill="#d61f1f"/>
    </marker>
    <marker id="arrow-black" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L14,5 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L14,5 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,9 L12,4.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L14,5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1250"/>
  <text class="title" x="70" y="58">Rangkaian PZEM-004T, ESP32, Relay, dan Kontaktor</text>
  <text class="subtitle" x="70" y="88">Versi PZEM-only: SCT-013, burden resistor 33 Ohm, dan rangkaian bias SCT tidak digunakan.</text>

  <rect class="zone" x="55" y="120" width="1790" height="310" rx="18"/>
  <text class="zone-title" x="80" y="155">A. Jalur AC 220 V: PLN, proteksi, PZEM, kontaktor, dan beban</text>

  <rect class="panel" x="85" y="190" width="170" height="145" rx="14"/>
  <text class="block-title" x="117" y="225">PLN 220 V</text>
  <text class="label" x="111" y="260">L / Fasa</text>
  <text class="label" x="111" y="292">N / Netral</text>
  <circle cx="218" cy="254" r="8" fill="#d61f1f"/>
  <circle cx="218" cy="286" r="8" fill="#111827"/>

  <rect class="panel" x="305" y="185" width="180" height="155" rx="14"/>
  <text class="block-title" x="338" y="220">MCB 1P</text>
  <text class="small" x="330" y="250">6A / 10A</text>
  <rect x="360" y="270" width="70" height="38" rx="8" fill="#fee2e2" stroke="#991b1b"/>
  <text class="label" x="382" y="295">ON</text>

  <rect class="warn" x="535" y="190" width="190" height="145" rx="14"/>
  <text class="block-title" x="568" y="225">F1 Fuse AC</text>
  <text class="small" x="558" y="255">1A-2A / 250VAC</text>
  <text class="tiny" x="558" y="282">Cabang kontrol:</text>
  <text class="tiny" x="558" y="302">adapter, PZEM, coil</text>

  <rect class="panel" x="780" y="172" width="260" height="190" rx="16"/>
  <text class="block-title" x="820" y="205">PZEM-004T V3.0</text>
  <text class="small" x="817" y="232">Meter: V, A, W, kWh, Hz, PF</text>
  <rect class="terminal" x="800" y="260" width="48" height="32" rx="5"/>
  <rect class="terminal" x="858" y="260" width="48" height="32" rx="5"/>
  <rect class="terminal" x="916" y="260" width="48" height="32" rx="5"/>
  <rect class="terminal" x="974" y="260" width="48" height="32" rx="5"/>
  <text class="termtext" x="817" y="281">L</text>
  <text class="termtext" x="874" y="281">N</text>
  <text class="termtext" x="930" y="281">CT1</text>
  <text class="termtext" x="988" y="281">CT2</text>
  <rect class="terminal" x="804" y="314" width="52" height="32" rx="5"/>
  <rect class="terminal" x="862" y="314" width="52" height="32" rx="5"/>
  <rect class="terminal" x="920" y="314" width="52" height="32" rx="5"/>
  <rect class="terminal" x="978" y="314" width="52" height="32" rx="5"/>
  <text class="termtext" x="815" y="335">5V</text>
  <text class="termtext" x="874" y="335">RX</text>
  <text class="termtext" x="932" y="335">TX</text>
  <text class="termtext" x="986" y="335">GND</text>

  <rect class="panel" x="1130" y="182" width="240" height="165" rx="16"/>
  <text class="block-title" x="1173" y="217">Kontaktor SN-10</text>
  <text class="small" x="1166" y="245">Coil 220VAC: A1 - A2</text>
  <text class="small" x="1166" y="272">Kontak utama memutus</text>
  <text class="small" x="1166" y="295">jalur fasa ke beban</text>
  <rect class="terminal" x="1155" y="315" width="48" height="28" rx="5"/>
  <rect class="terminal" x="1212" y="315" width="48" height="28" rx="5"/>
  <rect class="terminal" x="1268" y="315" width="48" height="28" rx="5"/>
  <text class="termtext" x="1169" y="334">A1</text>
  <text class="termtext" x="1226" y="334">A2</text>
  <text class="termtext" x="1277" y="334">MAIN</text>

  <rect class="panel" x="1460" y="185" width="180" height="155" rx="16"/>
  <text class="icon" x="1526" y="226">LOAD</text>
  <text class="block-title" x="1511" y="260">Lampu</text>
  <text class="small" x="1512" y="286">Beban uji 220V</text>
  <circle cx="1550" cy="312" r="18" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>

  <rect class="ok" x="1668" y="190" width="140" height="145" rx="14"/>
  <text class="block-title" x="1690" y="225">Open CT</text>
  <text class="small" x="1688" y="255">Clamp PZEM</text>
  <text class="tiny" x="1688" y="282">Jepit 1 kabel</text>
  <text class="tiny" x="1688" y="302">fasa saja</text>

  <path class="ac-l" marker-end="url(#arrow-red)" d="M218 254 H305"/>
  <path class="ac-n" marker-end="url(#arrow-black)" d="M218 286 H1460"/>
  <path class="ac-l" marker-end="url(#arrow-red)" d="M485 238 H1130"/>
  <path class="ac-l" marker-end="url(#arrow-red)" d="M1316 238 H1460"/>
  <path class="ac-l" d="M1390 238 C1460 225 1575 220 1668 252"/>
  <path class="ac-l" d="M1668 282 C1580 270 1490 268 1390 238"/>
  <path class="ac-l" marker-end="url(#arrow-red)" d="M500 238 V254 H535"/>
  <path class="ac-l" marker-end="url(#arrow-red)" d="M725 254 H800"/>
  <path class="ac-n" marker-end="url(#arrow-black)" d="M858 286 V276"/>
  <path class="ct" marker-end="url(#arrow-purple)" d="M1668 252 C1470 150 1120 150 940 260"/>
  <path class="ct" marker-end="url(#arrow-purple)" d="M1668 282 C1470 380 1120 370 998 260"/>
  <path class="ac-l" d="M1460 238 C1500 250 1525 285 1550 312"/>
  <path class="ac-n" d="M1460 286 C1500 292 1525 310 1550 330"/>
  <text class="tiny" x="1180" y="226">Fasa utama ke beban tidak lewat terminal PZEM</text>
  <text class="tiny" x="1365" y="235">Fasa beban melewati CT</text>

  <rect class="zone" x="55" y="465" width="1790" height="310" rx="18"/>
  <text class="zone-title" x="80" y="500">B. Jalur DC 12 V dan 5 V: power supply, stepdown, ESP32, PZEM TTL, relay, dan kapasitor</text>

  <rect class="panel" x="105" y="535" width="210" height="150" rx="14"/>
  <text class="block-title" x="135" y="570">Adaptor 12V 5A</text>
  <text class="small" x="135" y="598">Input AC dari F1</text>
  <text class="small" x="135" y="624">Output 12V DC</text>
  <rect class="terminal" x="130" y="642" width="60" height="28" rx="5"/>
  <rect class="terminal" x="205" y="642" width="60" height="28" rx="5"/>
  <text class="termtext" x="142" y="661">+12V</text>
  <text class="termtext" x="224" y="661">GND</text>

  <rect class="panel" x="390" y="535" width="220" height="150" rx="14"/>
  <text class="block-title" x="438" y="570">LM2596</text>
  <text class="small" x="425" y="598">Stepdown 12V ke 5V</text>
  <text class="small" x="425" y="624">Set output: 5.0 V</text>
  <rect class="terminal" x="415" y="642" width="60" height="28" rx="5"/>
  <rect class="terminal" x="490" y="642" width="60" height="28" rx="5"/>
  <text class="termtext" x="432" y="661">5V</text>
  <text class="termtext" x="509" y="661">GND</text>

  <rect class="warn" x="680" y="535" width="170" height="150" rx="14"/>
  <text class="block-title" x="710" y="570">F2 Fuse DC</text>
  <text class="small" x="705" y="598">1A-2A</text>
  <text class="tiny" x="705" y="624">Setelah LM2596</text>
  <text class="tiny" x="705" y="644">melindungi jalur 5V</text>

  <rect class="ok" x="915" y="535" width="190" height="150" rx="14"/>
  <text class="block-title" x="954" y="570">C1 Elco</text>
  <text class="small" x="948" y="598">100 uF / 16V</text>
  <text class="tiny" x="948" y="624">+ ke 5V</text>
  <text class="tiny" x="948" y="644">- ke GND</text>

  <rect class="panel" x="1180" y="515" width="220" height="190" rx="16"/>
  <text class="block-title" x="1250" y="550">ESP32</text>
  <text class="small" x="1210" y="577">VIN/5V, GND</text>
  <text class="small" x="1210" y="602">GPIO16 RX2</text>
  <text class="small" x="1210" y="627">GPIO17 TX2</text>
  <text class="small" x="1210" y="652">GPIO26 Relay IN1</text>
  <text class="small" x="1210" y="677">GPIO27 Relay IN2</text>
  <rect class="pin" x="1365" y="560" width="25" height="24" rx="4"/><text class="pintext" x="1370" y="577">5V</text>
  <rect class="pin" x="1365" y="590" width="25" height="24" rx="4"/><text class="pintext" x="1370" y="607">G</text>
  <rect class="pin" x="1365" y="620" width="25" height="24" rx="4"/><text class="pintext" x="1370" y="637">16</text>
  <rect class="pin" x="1365" y="650" width="25" height="24" rx="4"/><text class="pintext" x="1370" y="667">17</text>
  <rect class="pin" x="1365" y="680" width="25" height="24" rx="4"/><text class="pintext" x="1370" y="697">26</text>

  <rect class="panel" x="1490" y="530" width="250" height="165" rx="16"/>
  <text class="block-title" x="1530" y="565">Relay 2 Channel 5V</text>
  <text class="small" x="1520" y="594">VCC, GND, IN1, IN2</text>
  <text class="small" x="1520" y="622">CH1: COM-NO ke A1 coil</text>
  <text class="small" x="1520" y="650">CH2: opsional / cadangan</text>
  <rect class="terminal" x="1518" y="665" width="50" height="26" rx="5"/><text class="termtext" x="1530" y="683">VCC</text>
  <rect class="terminal" x="1575" y="665" width="50" height="26" rx="5"/><text class="termtext" x="1588" y="683">GND</text>
  <rect class="terminal" x="1632" y="665" width="50" height="26" rx="5"/><text class="termtext" x="1645" y="683">IN1</text>
  <rect class="terminal" x="1689" y="665" width="38" height="26" rx="5"/><text class="termtext" x="1696" y="683">IN2</text>

  <path class="dc12" marker-end="url(#arrow-blue)" d="M190 656 H415"/>
  <path class="gnd" d="M265 656 H490"/>
  <path class="dc5" marker-end="url(#arrow-blue)" d="M550 656 H680"/>
  <path class="dc5" marker-end="url(#arrow-blue)" d="M850 656 H915"/>
  <path class="dc5" marker-end="url(#arrow-blue)" d="M1105 656 H1365"/>
  <path class="gnd" d="M550 678 H915"/>
  <path class="gnd" d="M1105 678 H1365"/>
  <path class="dc5" marker-end="url(#arrow-blue)" d="M1390 572 H1518"/>
  <path class="gnd" d="M1390 602 H1575"/>
  <path class="dc5" marker-end="url(#arrow-blue)" d="M850 630 C865 560 785 345 804 330"/>
  <path class="gnd" d="M850 700 C890 720 985 500 1004 346"/>
  <text class="tiny" x="840" y="612">5V PZEM TTL</text>

  <rect class="zone" x="55" y="810" width="1790" height="300" rx="18"/>
  <text class="zone-title" x="80" y="845">C. Jalur sinyal dan kontrol: UART PZEM, GPIO relay, buzzer, dan catatan komponen</text>

  <rect class="panel" x="105" y="885" width="320" height="155" rx="16"/>
  <text class="block-title" x="135" y="920">UART PZEM ke ESP32</text>
  <text class="small" x="135" y="950">PZEM TX -> ESP32 GPIO16 RX2</text>
  <text class="small" x="135" y="978">ESP32 GPIO17 TX2 -> PZEM RX</text>
  <text class="tiny" x="135" y="1010">Jika TX PZEM 5V, gunakan logic level shifter</text>
  <text class="tiny" x="135" y="1030">atau pembagi tegangan yang benar ke RX ESP32.</text>

  <rect class="panel" x="485" y="885" width="260" height="155" rx="16"/>
  <text class="block-title" x="525" y="920">Level Shifter</text>
  <text class="small" x="515" y="950">Rekomendasi untuk UART</text>
  <text class="small" x="515" y="978">PZEM 5V &lt;-&gt; ESP32 3.3V</text>
  <text class="tiny" x="515" y="1010">Bukan burden resistor.</text>

  <rect class="panel" x="800" y="885" width="330" height="155" rx="16"/>
  <text class="block-title" x="830" y="920">Kontrol Relay</text>
  <text class="small" x="830" y="950">GPIO26 -> IN1 relay</text>
  <text class="small" x="830" y="978">GPIO27 -> IN2 relay (opsional)</text>
  <text class="small" x="830" y="1006">Relay CH1 NO memberi fasa ke A1 coil</text>

  <rect class="panel" x="1190" y="885" width="250" height="155" rx="16"/>
  <text class="block-title" x="1228" y="920">Buzzer</text>
  <text class="small" x="1220" y="950">GPIO25 -> buzzer aktif</text>
  <text class="small" x="1220" y="978">Buzzer - -> GND</text>
  <text class="tiny" x="1220" y="1010">Jika buzzer 5V arus besar, pakai transistor driver.</text>

  <rect class="no" x="1510" y="865" width="300" height="210" rx="16"/>
  <text class="block-title" x="1540" y="900">Tidak digunakan lagi</text>
  <text class="note" x="1540" y="932">1. SCT-013</text>
  <text class="note" x="1540" y="960">2. Burden resistor 33 Ohm SCT</text>
  <text class="note" x="1540" y="988">3. Bias ADC 10k/10k untuk SCT</text>
  <text class="note" x="1540" y="1016">4. ZMPT101B jika tegangan dari PZEM</text>
  <text class="tiny" x="1540" y="1048">PZEM sudah membaca tegangan dan arus.</text>

  <path class="sig" marker-end="url(#arrow-purple)" d="M920 330 C720 470 650 780 615 885"/>
  <path class="sig" marker-end="url(#arrow-purple)" d="M862 330 C680 460 590 780 615 885"/>
  <path class="sig" marker-end="url(#arrow-purple)" d="M745 960 H800"/>
  <path class="ctrl" marker-end="url(#arrow-green)" d="M1390 692 C1430 720 1560 730 1657 692"/>
  <path class="ctrl" marker-end="url(#arrow-green)" d="M1390 662 C1440 700 1540 710 1708 692"/>
  <path class="ctrl" marker-end="url(#arrow-green)" d="M1130 1000 C1165 1000 1180 970 1190 960"/>

  <rect class="warn" x="70" y="1135" width="1760" height="80" rx="14"/>
  <text class="note-title" x="95" y="1165">Catatan keselamatan</text>
  <text class="note" x="95" y="1192">Matikan MCB sebelum merakit. Jalur 220V wajib berada di box panel tertutup, memakai terminal block, isolasi rapi, dan dikerjakan/ditinjau teknisi listrik.</text>
  <text class="note" x="95" y="1210">Fuse tidak menggantikan MCB/RCD/ELCB. Fuse hanya proteksi tambahan untuk cabang kontrol dan jalur DC kecil.</text>

  <rect x="70" y="102" width="540" height="16" rx="8" fill="#d61f1f"/>
  <text class="tiny" x="628" y="115">Merah: fasa AC</text>
  <rect x="740" y="102" width="100" height="16" rx="8" fill="#111827"/>
  <text class="tiny" x="858" y="115">Hitam: netral AC</text>
  <rect x="985" y="102" width="100" height="16" rx="8" fill="#0ea5e9"/>
  <text class="tiny" x="1103" y="115">Biru: 5V DC</text>
  <rect x="1230" y="102" width="100" height="16" rx="8" fill="#7c3aed"/>
  <text class="tiny" x="1348" y="115">Ungu putus-putus: UART</text>
</svg>
